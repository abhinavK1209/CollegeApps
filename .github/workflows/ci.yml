name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # The build runs `prisma migrate deploy`, so CI needs a real database.
    # This also lets migrations themselves be verified on every PR.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sequence
          POSTGRES_PASSWORD: sequence
          POSTGRES_DB: sequence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sequence -d sequence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sequence:sequence@localhost:5432/sequence?schema=public
      DATABASE_URL_UNPOOLED: postgresql://sequence:sequence@localhost:5432/sequence?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
