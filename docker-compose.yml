services:
  postgres:
    image: postgres:16-alpine
    container_name: sequence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sequence
      POSTGRES_PASSWORD: sequence
      POSTGRES_DB: sequence
    ports:
      - "5432:5432"
    volumes:
      - sequence-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sequence -d sequence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sequence-pgdata:
